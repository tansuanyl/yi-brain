<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yi-Brain | 易经驱动的 AI 解惑系统</title>
    <meta
      name="description"
      content="Yi-Brain 是一个以易经推演为核心逻辑的 AI 问答与决策辅助应用。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Yi-Brain</p>
          <h1>以易经结构做推演，以 AI 语言给建议。</h1>
          <p class="lede">
            将“起卦、变爻、时位”转化为结构化推理流程，帮助用户做反思、决策和情境判断。
          </p>
        </div>
        <div class="hero-card">
          <p>产品方法</p>
          <ul>
            <li>占卜式 Prompting</li>
            <li>本卦 → 变卦 条件推演</li>
            <li>时位感知解码</li>
          </ul>
        </div>
      </header>

      <main class="layout">
        <section class="panel input-panel">
          <div class="panel-header">
            <h2>开始问事</h2>
            <p>输入问题、背景和可选方案，生成一次完整的易理推演。</p>
          </div>

          <form id="reading-form">
            <label>
              <span>你的问题</span>
              <textarea
                id="question"
                name="question"
                rows="4"
                placeholder="例如：我是否应该在今年换工作？"
                required
              ></textarea>
            </label>

            <div class="grid-two">
              <label>
                <span>问题分类</span>
                <select id="category" name="category">
                  <option value="">自动识别</option>
                  <option value="career">事业</option>
                  <option value="relationship">感情</option>
                  <option value="decision">决策</option>
                  <option value="study">学习</option>
                </select>
              </label>

              <label>
                <span>可选方案</span>
                <input
                  id="options"
                  name="options"
                  type="text"
                  placeholder="用中文逗号分隔，例如：留下，跳槽，创业"
                />
              </label>
            </div>

            <label>
              <span>补充背景</span>
              <textarea
                id="profile"
                name="profile"
                rows="4"
                placeholder="例如：我在当前公司做了 5 年，最近成长停滞，但新机会风险较高。"
              ></textarea>
            </label>

            <label class="toggle">
              <input id="useAI" name="useAI" type="checkbox" checked />
              <span>调用 AI 生成现代语言解读</span>
            </label>

            <button id="submit-button" type="submit">起卦并推演</button>
          </form>
        </section>

        <section class="panel result-panel">
          <div class="panel-header">
            <h2>推演结果</h2>
            <p id="status-text">提交问题后，这里会展示本卦、变卦、变爻和行动建议。</p>
          </div>

          <div id="empty-state" class="empty-state">
            <p>Yi-Brain 会把你的问题转成一次“结构化易理推演”。</p>
          </div>

          <div id="result-root" class="result-root hidden">
            <div class="hexagram-wrap">
              <div>
                <h3>本卦</h3>
                <div id="primary-hexagram" class="hexagram-card"></div>
              </div>
              <div>
                <h3>之卦</h3>
                <div id="relating-hexagram" class="hexagram-card"></div>
              </div>
            </div>

            <div class="insight-grid">
              <article class="insight-card">
                <h3>核心判断</h3>
                <p id="judgement"></p>
              </article>
              <article class="insight-card">
                <h3>变爻提示</h3>
                <ul id="line-advice"></ul>
              </article>
              <article class="insight-card">
                <h3>条件推演</h3>
                <ul id="scenarios"></ul>
              </article>
              <article class="insight-card">
                <h3>行动建议</h3>
                <ul id="actions"></ul>
              </article>
            </div>

            <article class="insight-card">
              <h3>时位感知解码</h3>
              <div id="temporal-strategy" class="timeline"></div>
            </article>

            <article class="insight-card">
              <h3>AI 解读</h3>
              <div id="ai-output" class="ai-output"></div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
